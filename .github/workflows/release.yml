name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release tag & version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          $ver = $tag.TrimStart('v')
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run tests
        run: dotnet test --configuration Release

      - name: Publish self-contained single-file binary
        run: >
          dotnet publish src/mssqlcl/mssqlcl.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.APP_VERSION }}
          -o dist/win-x64

      - name: Package SQLcl-style portable ZIP & SHA-256 checksum
        shell: pwsh
        run: |
          $stage = "dist/package"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "dist/win-x64/mssqlcl.exe" "$stage/mssqlcl.exe"
          Copy-Item "README.md" "$stage/README.md"
          Copy-Item "LICENSE" "$stage/LICENSE"
          Copy-Item "scripts/install-local.ps1" "$stage/install-local.ps1"

          $zipName = "mssqlcl-${{ env.RELEASE_TAG }}-win-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$zipName" -Force

          $hash = (Get-FileHash -Path "dist/$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Out-File -FilePath "dist/checksums.txt" -Encoding ascii

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/mssqlcl-${{ env.RELEASE_TAG }}-win-x64.zip
            dist/checksums.txt
