name: Watch - Extension MSSQL Upstream
run-name: Watch extension-mssql (${{ github.event_name }})

on:
  schedule:
    # Runs every Monday at 06:00 AM Peru time (UTC-5 = 11:00 UTC)
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log summary without creating an Issue)'
        required: false
        default: false
        type: boolean
      baseline_override:
        description: 'Optional previous tag override for comparison (e.g. mssql-v1.46.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  UPSTREAM_REPO: microsoft/vscode-mssql
  BASELINE_TAG: mssql-v1.47.0
  UPSTREAM_LABEL: upstream-sync

jobs:
  detect-upstream:
    name: 1. Detect & Compare Upstream
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      latest_tag: ${{ steps.upstream.outputs.latest_tag }}
      published_at: ${{ steps.upstream.outputs.published_at }}
      release_url: ${{ steps.upstream.outputs.release_url }}
      should_open: ${{ steps.check.outputs.should_open }}
      compare_base: ${{ steps.check.outputs.compare_base }}
      relevant_count: ${{ steps.compare.outputs.relevant_count }}

    steps:
      - name: Fetch latest vscode-mssql release
        id: upstream
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            "User-Agent"    = "mssqlcl-upstream-watch"
            "Accept"        = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GH_TOKEN"
          }

          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:UPSTREAM_REPO/releases?per_page=30" -Headers $headers
          $latest = $releases | Where-Object {
            -not $_.draft -and -not $_.prerelease -and $_.tag_name -match '^mssql-v\d+\.\d+\.\d+'
          } | Select-Object -First 1

          if (-not $latest) {
            Write-Error "No stable mssql-v* release found in $env:UPSTREAM_REPO."
            exit 1
          }

          Write-Host "Latest upstream tag : $($latest.tag_name)"
          Write-Host "Published at        : $($latest.published_at)"
          Write-Host "Release URL         : $($latest.html_url)"

          "latest_tag=$($latest.tag_name)"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "published_at=$($latest.published_at)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_url=$($latest.html_url)"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $ctxDir = Join-Path $env:RUNNER_TEMP "upstream-context"
          New-Item -ItemType Directory -Force -Path $ctxDir | Out-Null

          $body = if ($latest.body) { $latest.body } else { "_No release notes provided._" }
          if ($body.Length -gt 25000) {
            $body = $body.Substring(0, 25000) + "`n`n...(truncated)"
          }
          $body | Out-File -FilePath (Join-Path $ctxDir "release_notes.md") -Encoding utf8

      - name: Check if release is already tracked
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          LATEST_TAG: ${{ steps.upstream.outputs.latest_tag }}
          BASELINE_OVERRIDE: ${{ github.event.inputs.baseline_override }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          $latestTag = $env:LATEST_TAG
          $override  = "$env:BASELINE_OVERRIDE".Trim()
          $isDryRun  = $env:DRY_RUN -eq "true"

          Write-Host "Baseline tag : $env:BASELINE_TAG"
          Write-Host "Latest tag   : $latestTag"
          Write-Host "Dry run      : $isDryRun"

          $headers = @{
            "User-Agent"    = "mssqlcl-upstream-watch"
            "Accept"        = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GH_TOKEN"
          }

          $issues = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPO/issues?state=all&labels=$env:UPSTREAM_LABEL&per_page=50" -Headers $headers
          $trackedTags = @()
          foreach ($iss in $issues) {
            if ($iss.title -match '(mssql-v\d+\.\d+\.\d+[^\s\]]*)') {
              $trackedTags += $Matches[1]
            }
          }

          $alreadyTracked = ($latestTag -eq $env:BASELINE_TAG) -or ($trackedTags -contains $latestTag)
          $shouldOpen = ((-not $alreadyTracked) -or $isDryRun).ToString().ToLowerInvariant()

          $compareBase = if ($override) {
            $override
          } elseif ($trackedTags.Count -gt 0 -and $trackedTags[0] -ne $latestTag) {
            $trackedTags[0]
          } else {
            $env:BASELINE_TAG
          }

          Write-Host "Already tracked : $alreadyTracked"
          Write-Host "Compare base    : $compareBase"
          Write-Host "Should proceed  : $shouldOpen"

          "should_open=$shouldOpen"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "compare_base=$compareBase"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "already_tracked=$alreadyTracked" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Compare relevant MCP and connection paths
        id: compare
        if: steps.check.outputs.should_open == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPARE_BASE: ${{ steps.check.outputs.compare_base }}
          LATEST_TAG: ${{ steps.upstream.outputs.latest_tag }}
        run: |
          $baseTag   = $env:COMPARE_BASE
          $latestTag = $env:LATEST_TAG

          $headers = @{
            "User-Agent"    = "mssqlcl-upstream-watch"
            "Accept"        = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GH_TOKEN"
          }

          $relevantPatterns = @(
            '^extensions/mssql/src/copilot/tools/',
            '^extensions/mssql/src/copilot/prompts',
            '^extensions/mssql/src/copilot/chatCommands',
            '^extensions/mssql/src/copilot/chatConstants',
            '^extensions/mssql/src/connectionconfig/',
            '^extensions/mssql/package\.json$'
          )

          $relevantFiles = @()
          if ($baseTag -and $baseTag -ne $latestTag) {
            $cmpUrl = "https://api.github.com/repos/$env:UPSTREAM_REPO/compare/$baseTag...$latestTag"
            Write-Host "Comparing $baseTag...$latestTag"
            $cmp = Invoke-RestMethod -Uri $cmpUrl -Headers $headers
            foreach ($f in $cmp.files) {
              $path = $f.filename
              if ($relevantPatterns | Where-Object { $path -match $_ }) {
                $relevantFiles += "- ``$($f.status)`` [``$path``]($($f.blob_url)) (+$($f.additions)/-$($f.deletions))"
              }
            }
          }

          if ($relevantFiles.Count -eq 0) {
            $summary = "_No changes detected in tracked MCP/prompt/connection paths between ``$baseTag`` and ``$latestTag``._"
          } else {
            $summary = ($relevantFiles | Select-Object -First 40) -join "`n"
            if ($relevantFiles.Count -gt 40) {
              $summary += "`n- ...and $($relevantFiles.Count - 40) more relevant file(s)."
            }
          }

          $ctxDir = Join-Path $env:RUNNER_TEMP "upstream-context"
          New-Item -ItemType Directory -Force -Path $ctxDir | Out-Null
          $summary | Out-File -FilePath (Join-Path $ctxDir "relevant_files.md") -Encoding utf8

          Write-Host "Relevant file count: $($relevantFiles.Count)"
          "relevant_count=$($relevantFiles.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build AI prompt from release notes and changed paths
        if: steps.check.outputs.should_open == 'true'
        shell: pwsh
        env:
          LATEST_TAG: ${{ steps.upstream.outputs.latest_tag }}
          COMPARE_BASE: ${{ steps.check.outputs.compare_base }}
        run: |
          $ctxDir       = Join-Path $env:RUNNER_TEMP "upstream-context"
          $releaseNotes = Get-Content (Join-Path $ctxDir "release_notes.md") -Raw -Encoding utf8
          $relevantList = Get-Content (Join-Path $ctxDir "relevant_files.md") -Raw -Encoding utf8

          if ($releaseNotes.Length -gt 8000) {
            $releaseNotes = $releaseNotes.Substring(0, 8000) + "`n...(truncated)"
          }

          $prompt = @(
            "Eres un asistente tecnico para el proyecto mssqlcl (CLI y servidor MCP en .NET 10 para SQL Server).",
            "Analiza esta nueva release de $env:UPSTREAM_REPO ($env:LATEST_TAG, comparada contra $env:COMPARE_BASE).",
            "",
            "Responde en español usando Markdown limpio y conciso con estas 3 secciones exactas:",
            "### Cambios relevantes para mssqlcl",
            "(Max. 5 bullets cortos sobre herramientas MCP, prompts, Auth/Azure, consultas, schemas o conexiones utiles para inspirar o portar a mssqlcl. Si no hay nada relevante en codigo, dilo brevemente.)",
            "",
            "### Cambios solo de UI (VS Code)",
            "(1 linea resumiendo lo que se descarta por ser exclusivo de interfaz grafica de VS Code.)",
            "",
            "### Recomendacion",
            "(Si o No conviene priorizar revisarlo en mssqlcl + 1 frase explicando que area o archivo revisar primero.)",
            "",
            "Archivos MCP/Connection modificados ($env:COMPARE_BASE...$env:LATEST_TAG):",
            $relevantList,
            "",
            "Release notes ($env:LATEST_TAG):",
            $releaseNotes
          ) -join "`n"

          $prompt | Out-File -FilePath (Join-Path $ctxDir "ai_prompt.txt") -Encoding utf8
          Write-Host "Prepared ai_prompt.txt ($($prompt.Length) chars)"

      - name: Write upstream detection summary
        shell: pwsh
        env:
          LATEST_TAG: ${{ steps.upstream.outputs.latest_tag }}
          RELEASE_URL: ${{ steps.upstream.outputs.release_url }}
          COMPARE_BASE: ${{ steps.check.outputs.compare_base }}
          ALREADY_TRACKED: ${{ steps.check.outputs.already_tracked }}
          SHOULD_OPEN: ${{ steps.check.outputs.should_open }}
          RELEVANT_COUNT: ${{ steps.compare.outputs.relevant_count }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          $relCount = if ([string]::IsNullOrWhiteSpace($env:RELEVANT_COUNT)) { "-" } else { $env:RELEVANT_COUNT }
          @(
            "### Upstream Detection Traceability",
            "",
            "| Field | Value |",
            "| :--- | :--- |",
            "| Upstream Repo | ``$env:UPSTREAM_REPO`` |",
            "| Latest Stable Release | [``$env:LATEST_TAG``]($env:RELEASE_URL) |",
            "| Baseline / Compare Base | ``$env:BASELINE_TAG`` / ``$env:COMPARE_BASE`` |",
            "| Already Tracked | ``$env:ALREADY_TRACKED`` |",
            "| Relevant MCP/Conn Files | ``$relCount`` |",
            "| Dry Run | ``$($env:DRY_RUN -eq 'true')`` |",
            "| Proceed to AI & Issue | ``$env:SHOULD_OPEN`` |"
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload upstream context artifact
        if: steps.check.outputs.should_open == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: upstream-context
          path: ${{ runner.temp }}/upstream-context
          retention-days: 7

  ai-analysis:
    name: 2. AI Analysis (Gemini)
    needs: detect-upstream
    if: needs.detect-upstream.outputs.should_open == 'true'
    uses: ./.github/workflows/ai-gemini-summarize.yml
    with:
      context_artifact: upstream-context
      prompt_file: ai_prompt.txt
      output_artifact: ai-summary
    secrets: inherit

  publish-issue:
    name: 3. Publish Upstream-Sync Issue
    needs: [detect-upstream, ai-analysis]
    if: always() && needs.detect-upstream.result == 'success' && needs.detect-upstream.outputs.should_open == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Download upstream context artifact
        uses: actions/download-artifact@v8
        with:
          name: upstream-context
          path: ${{ runner.temp }}/issue-inputs

      - name: Download AI summary artifact
        if: needs.ai-analysis.result == 'success' && needs.ai-analysis.outputs.has_summary == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ai-summary
          path: ${{ runner.temp }}/issue-inputs

      - name: Assemble Issue Markdown body
        shell: pwsh
        env:
          LATEST_TAG: ${{ needs.detect-upstream.outputs.latest_tag }}
          COMPARE_BASE: ${{ needs.detect-upstream.outputs.compare_base }}
          PUBLISHED_AT: ${{ needs.detect-upstream.outputs.published_at }}
          RELEASE_URL: ${{ needs.detect-upstream.outputs.release_url }}
          AI_STATUS: ${{ needs.ai-analysis.outputs.ai_status }}
          AI_MODEL: ${{ needs.ai-analysis.outputs.ai_model }}
          PROMPT_TOKENS: ${{ needs.ai-analysis.outputs.prompt_tokens }}
          OUTPUT_TOKENS: ${{ needs.ai-analysis.outputs.output_tokens }}
          TOTAL_TOKENS: ${{ needs.ai-analysis.outputs.total_tokens }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $inDir         = Join-Path $env:RUNNER_TEMP "issue-inputs"
          $releaseNotes  = (Get-Content (Join-Path $inDir "release_notes.md") -Raw -Encoding utf8).Trim()
          $relevantList  = (Get-Content (Join-Path $inDir "relevant_files.md") -Raw -Encoding utf8).Trim()
          $aiSummaryFile = Join-Path $inDir "ai_summary.md"

          $aiSection = if (Test-Path $aiSummaryFile) {
            $aiText = (Get-Content $aiSummaryFile -Raw -Encoding utf8).Trim()
            @(
              "## AI Summary (``$env:AI_MODEL``)",
              "",
              $aiText
            ) -join "`n"
          } elseif ($env:AI_STATUS -eq "skipped_no_key") {
            "_AI summary skipped (``GEMINI_API_KEY`` repository secret is not configured)._"
          } else {
            "_AI summary unavailable for this run (Gemini API fallback chain did not return a response)._"
          }

          $traceFooter = if ($env:AI_MODEL) {
            "_Generated by [Run #$env:RUN_NUMBER]($env:RUN_URL) · AI Model: ``$env:AI_MODEL`` · Tokens (in/out/total): ``$env:PROMPT_TOKENS/$env:OUTPUT_TOKENS/$env:TOTAL_TOKENS``_"
          } else {
            "_Generated by [Run #$env:RUN_NUMBER]($env:RUN_URL) · AI Status: ``$env:AI_STATUS``_"
          }

          $issueBody = @(
            "## Upstream Release Detected",
            "",
            "- **Repository:** ``$env:UPSTREAM_REPO``",
            "- **New Release:** [``$env:LATEST_TAG``]($env:RELEASE_URL) (published ``$env:PUBLISHED_AT``)",
            "- **Compared Against:** ``$env:COMPARE_BASE``",
            "",
            "---",
            "",
            $aiSection,
            "",
            "---",
            "",
            "## Relevant MCP / Connection Changes (``$env:COMPARE_BASE...$env:LATEST_TAG``)",
            "",
            $relevantList,
            "",
            "---",
            "",
            "## Evaluation Checklist for ``mssqlcl``",
            "",
            "- [ ] New MCP tools or parameters in ``extensions/mssql/src/copilot/tools/``?",
            "- [ ] New MCP prompts / behavior updates in ``prompts.ts``?",
            "- [ ] Changes in ``mssql.connections`` schema or ``SecretStorage`` format?",
            "- [ ] UI-only VS Code changes (ignore for headless ``mssqlcl``).",
            "",
            "---",
            "",
            "<details>",
            "<summary>Upstream Release Notes ($env:LATEST_TAG)</summary>",
            "",
            $releaseNotes,
            "",
            "</details>",
            "",
            "---",
            "",
            $traceFooter
          ) -join "`n"

          $issueBody | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "issue_body.md") -Encoding utf8

      - name: Preview Issue body (Dry Run)
        if: github.event.inputs.dry_run == 'true'
        shell: pwsh
        env:
          LATEST_TAG: ${{ needs.detect-upstream.outputs.latest_tag }}
          AI_STATUS: ${{ needs.ai-analysis.outputs.ai_status }}
          AI_MODEL: ${{ needs.ai-analysis.outputs.ai_model }}
        run: |
          $title = "[upstream-sync] vscode-mssql $env:LATEST_TAG"
          $issueBody = Get-Content (Join-Path $env:RUNNER_TEMP "issue_body.md") -Raw -Encoding utf8
          Write-Host "=== DRY RUN: Would create Issue '$title' ==="
          Write-Host "AI Status: $env:AI_STATUS | AI Model: $env:AI_MODEL"
          Write-Host ""
          Write-Host $issueBody

          @(
            "### Issue Publishing Traceability",
            "",
            "- **Mode:** ``dry_run`` (no Issue created)",
            "- **Would Title:** ``$title``",
            "- **AI Status:** ``$env:AI_STATUS`` (``$env:AI_MODEL``)"
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Ensure upstream-sync label exists
        if: github.event.inputs.dry_run != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          $headers = @{
            "User-Agent"    = "mssqlcl-upstream-watch"
            "Accept"        = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GH_TOKEN"
          }

          try {
            Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPO/labels/$env:UPSTREAM_LABEL" -Headers $headers | Out-Null
          } catch {
            $labelPayload = @{
              name        = $env:UPSTREAM_LABEL
              color       = "1d76db"
              description = "Upstream vscode-mssql release or MCP change to evaluate"
            } | ConvertTo-Json
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPO/labels" -Headers $headers -Body $labelPayload -ContentType "application/json; charset=utf-8" | Out-Null
          }

      - name: Create upstream-sync GitHub Issue
        if: github.event.inputs.dry_run != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          LATEST_TAG: ${{ needs.detect-upstream.outputs.latest_tag }}
          AI_STATUS: ${{ needs.ai-analysis.outputs.ai_status }}
          AI_MODEL: ${{ needs.ai-analysis.outputs.ai_model }}
        run: |
          $headers = @{
            "User-Agent"    = "mssqlcl-upstream-watch"
            "Accept"        = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GH_TOKEN"
          }

          $title = "[upstream-sync] vscode-mssql $env:LATEST_TAG"
          $issueBody = Get-Content (Join-Path $env:RUNNER_TEMP "issue_body.md") -Raw -Encoding utf8

          $payload = @{
            title  = $title
            body   = $issueBody
            labels = @($env:UPSTREAM_LABEL)
          } | ConvertTo-Json -Depth 4

          $created = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPO/issues" -Headers $headers -Body ([System.Text.Encoding]::UTF8.GetBytes($payload)) -ContentType "application/json; charset=utf-8"
          Write-Host "Created Issue #$($created.number): $($created.html_url)"

          @(
            "### Issue Publishing Traceability",
            "",
            "- **Created Issue:** [#$($created.number) - $title]($($created.html_url))",
            "- **AI Status:** ``$env:AI_STATUS`` (``$env:AI_MODEL``)"
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
