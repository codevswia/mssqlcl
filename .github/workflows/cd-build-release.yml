name: CD - Build & Release
run-name: Release ${{ github.event.inputs.tag || github.ref_name }} (${{ github.event_name }})

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    name: Build & Package (win-x64)
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Read trigger & raw inputs
        id: trigger
        shell: pwsh
        run: |
          $eventName = "${{ github.event_name }}"
          $inputTag  = "${{ github.event.inputs.tag }}"
          $refName   = "${{ github.ref_name }}"

          Write-Host "Trigger event : $eventName"
          Write-Host "Input tag     : $inputTag"
          Write-Host "Git ref name  : $refName"

          "event_name=$eventName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "input_tag=$inputTag"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "ref_name=$refName"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Validate & resolve release version
        id: version
        shell: pwsh
        run: |
          $eventName = "${{ steps.trigger.outputs.event_name }}"
          $inputTag  = "${{ steps.trigger.outputs.input_tag }}"
          $refName   = "${{ steps.trigger.outputs.ref_name }}"

          if ($eventName -eq "workflow_dispatch") {
            $tag = $inputTag.Trim()
          } else {
            $tag = $refName.Trim()
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "Invalid release tag '$tag'. Expected SemVer format like 'v1.0.0'."
            exit 1
          }

          $appVersion = $tag.TrimStart('v')
          Write-Host "Resolved release tag : $tag"
          Write-Host "Resolved app version : $appVersion"

          "release_tag=$tag"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "app_version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run tests
        run: dotnet test --configuration Release

      - name: Publish self-contained single-file binary
        run: >
          dotnet publish src/mssqlcl/mssqlcl.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.app_version }}
          -o dist/win-x64

      - name: Package portable ZIP & SHA-256 checksum
        shell: pwsh
        run: |
          $stage = "dist/package"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "dist/win-x64/mssqlcl.exe" "$stage/mssqlcl.exe"
          Copy-Item "README.md" "$stage/README.md"
          Copy-Item "LICENSE" "$stage/LICENSE"
          Copy-Item "scripts/install-local.ps1" "$stage/install-local.ps1"
          Copy-Item "scripts/install.cmd" "$stage/install.cmd"

          $zipName = "mssqlcl-${{ steps.version.outputs.release_tag }}-win-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$zipName" -Force

          $hash = (Get-FileHash -Path "dist/$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Out-File -FilePath "dist/checksums.txt" -Encoding ascii

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          generate_release_notes: true
          files: |
            dist/mssqlcl-${{ steps.version.outputs.release_tag }}-win-x64.zip
            dist/checksums.txt

  publish-nuget:
    name: Publish NuGet (dotnet tool)
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pack NuGet dotnet tool
        run: >
          dotnet pack src/mssqlcl/mssqlcl.csproj
          -c Release
          -p:Version=${{ needs.build-windows.outputs.app_version }}
          -o dist/nupkg

      - name: NuGet Login (Trusted Publishing OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: bry4nr4u1.ai

      - name: Push package to NuGet.org
        run: >
          dotnet nuget push dist/nupkg/*.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  publish-mcp-registry:
    name: Publish MCP Registry
    needs: [build-windows, publish-nuget]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update server.json version for release
        run: |
          VERSION="${{ needs.build-windows.outputs.app_version }}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar -xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Authenticate & Publish to MCP Registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
