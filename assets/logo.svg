<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="mssqlcl logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Outer rounded badge -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Subtle MCP connection arcs -->
  <path d="M 90 34 C 102 44, 102 62, 90 72" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.45" />
  <path d="M 97 26 C 114 40, 114 66, 97 80" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.25" />

  <!-- SQL Database Cylinder (left/top) -->
  <ellipse cx="46" cy="40" rx="22" ry="8" fill="#7DD3FC" />
  <path d="M 24 40 L 24 58 C 24 62.4 33.8 66 46 66 C 58.2 66 68 62.4 68 58 L 68 40 C 68 44.4 58.2 48 46 48 C 33.8 48 24 44.4 24 40 Z" fill="url(#dbGrad)" />
  <path d="M 24 58 L 24 76 C 24 80.4 33.8 84 46 84 C 58.2 84 68 80.4 68 76 L 68 58 C 68 62.4 58.2 66 46 66 C 33.8 66 24 62.4 24 58 Z" fill="#0369A1" />
  <ellipse cx="46" cy="40" rx="22" ry="8" fill="none" stroke="#BAE6FD" stroke-width="1.5" />

  <!-- Terminal Prompt Badge (bottom-right) -->
  <rect x="54" y="64" width="52" height="38" rx="9" fill="#020617" stroke="url(#accentGrad)" stroke-width="2.5" />
  <!-- >_ symbol -->
  <path d="M 65 76 L 74 83 L 65 90" fill="none" stroke="#38BDF8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="79" y1="90" x2="94" y2="90" stroke="#E2E8F0" stroke-width="3.2" stroke-linecap="round" />

  <!-- MCP Node dot -->
  <circle cx="90" cy="34" r="4" fill="#38BDF8" />
</svg>
